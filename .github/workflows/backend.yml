name: Backend

on:
  push:
    paths:
      - 'project/backend/**'
      - 'contracts/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'project/backend/**'
      - 'contracts/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: repopulse_test
          POSTGRES_PASSWORD: repopulse_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repopulse_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REPOPULSE_TEST_DATABASE_URL: postgres://repopulse_test:repopulse_test@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: project/backend/go.mod
          cache-dependency-path: project/backend/go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Lint (go vet)
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build all service binaries
        run: go build -o bin/ ./cmd/...
